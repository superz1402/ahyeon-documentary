# .github/workflows/yt-download-farm.yml
# Remote download farm for ytagent (hardened).
#
# Triggered via API from a blocked cloud environment by ytagent's
# github_actions_farm method (github_owner/github_repo opts point here).
# Runs on GitHub's runners (Azure IPs that YouTube doesn't block), installs
# Cloudflare WARP best-effort for extra safety, downloads the video with
# yt-dlp + BGutil PO token, verifies it, and uploads it as a workflow artifact.
#
# Trigger manually via API:
#   curl -X POST \
#     -H "Authorization: token $GITHUB_TOKEN" \
#     -H "Accept: application/vnd.github+json" \
#     https://api.github.com/repos/superz1402/ahyeon-documentary/actions/workflows/yt-download-farm.yml/dispatches \
#     -d '{"ref":"main","inputs":{"video_url":"https://www.youtube.com/watch?v=VIDEO_ID"}}'

name: YT Download Farm

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL or ID'
        required: true
        type: string
      video_id:
        description: 'Video ID (11 chars, optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Parse video ID
        id: vid
        run: |
          URL="${{ github.event.inputs.video_url }}"
          VID="${{ github.event.inputs.video_id }}"
          if [ -z "$VID" ]; then
            VID=$(echo "$URL" | grep -oE 'v=([A-Za-z0-9_-]{11})' | cut -d= -f2 | head -1)
          fi
          if [ -z "$VID" ]; then
            VID=$(echo "$URL" | grep -oE '[A-Za-z0-9_-]{11}' | head -1)
          fi
          echo "video_id=$VID" >> $GITHUB_OUTPUT
          echo "Parsed video ID: $VID"

      - name: Install Cloudflare WARP (best-effort)
        run: |
          set +e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          # warp-cli demands a TTY for TOS acceptance — fake one AND answer the [y/N] prompt
          warp() { printf 'y\n' | script -qec "$*" /dev/null; }
          sudo systemctl start warp-svc 2>/dev/null || (sudo warp-svc > /tmp/warpsvc.log 2>&1 &)
          for i in $(seq 1 15); do
            if warp "warp-cli status" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          warp "warp-cli registration new"
          warp "warp-cli mode proxy"
          warp "warp-cli connect"
          sleep 5
          warp "warp-cli status" || true
          if warp "warp-cli status" 2>/dev/null | grep -q "Connected"; then
            echo "warp_ok=1" >> "$HOME/.warp_ok"
            echo "WARP connected — proxy http://127.0.0.1:40000 available"
          else
            echo "WARP not connected — will download directly (Azure IPs usually allowed)"
          fi
          exit 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp + BGutil
        run: |
          pip install -U yt-dlp bgutil-ytdlp-pot-provider requests
          sudo apt-get install -y -qq ffmpeg || true

      - name: Set up BGutil POT provider
        run: |
          git clone --depth=1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          npm install --production
          npm install typescript
          ./node_modules/.bin/tsc
          nohup node build/main.js --port 4416 > /tmp/bgutil.log 2>&1 &
          sleep 5
          curl -s http://127.0.0.1:4416/ping || true

      - name: Download video
        env:
          YTDLP_PLUGIN_DIRS: /opt/hostedtoolcache/Python/3.12/x64/lib/python3.12/site-packages/yt_dlp_plugins
        run: |
          VID="${{ steps.vid.outputs.video_id }}"
          echo "Downloading video: $VID"
          PROXY_ARGS=""
          if [ -f "$HOME/.warp_ok" ]; then
            PROXY_ARGS="--proxy http://127.0.0.1:40000"
          fi
          COMMON=(--no-cache-dir --no-check-certificates
                  --merge-output-format mp4
                  --postprocessor-args "ffmpeg:-movflags +faststart"
                  -o "video_${VID}.%(ext)s")
          # 1) web client (matches BGutil's GVS PO token) + WARP proxy if connected
          yt-dlp "${COMMON[@]}" --extractor-args "youtube:player_client=web" \
            $PROXY_ARGS -f "18/best[ext=mp4]/worst[ext=mp4]/worst" \
            "https://www.youtube.com/watch?v=${VID}" \
          # 2) web client direct
          || yt-dlp "${COMMON[@]}" --extractor-args "youtube:player_client=web" \
            -f "18/best[ext=mp4]/worst[ext=mp4]/worst" \
            "https://www.youtube.com/watch?v=${VID}" \
          # 3) tv+web_safari clients direct (BGutil still serves tokens)
          || yt-dlp "${COMMON[@]}" \
            --extractor-args "youtube:player_client=tv,web_safari" \
            -f "best[ext=mp4]/worst[ext=mp4]/worst" \
            "https://www.youtube.com/watch?v=${VID}" \
          # 4) absolute fallback: default clients direct
          || yt-dlp --no-cache-dir -f "best[ext=mp4]/worst[ext=mp4]/worst" \
                    --merge-output-format mp4 -o "video_${VID}.%(ext)s" \
                    "https://www.youtube.com/watch?v=${VID}"

      - name: Verify video
        run: |
          VID="${{ steps.vid.outputs.video_id }}"
          ls -la video_${VID}.* || exit 1
          file video_${VID}.*
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name video_${VID}.* 2>&1 | head -10

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video_${{ steps.vid.outputs.video_id }}
          path: video_${{ steps.vid.outputs.video_id }}.*
          retention-days: 7
          compression-level: 0  # video is already compressed
